[build]
image = "alpine:3.20.10"
command = ["sh", "-lc", "mkdir -p build && cat /etc/alpine-release > build/out.txt"]
outputs = ["build/out.txt"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1
image_variants = ["alpine:3.21.7"]

[experiments.dimensions]
network_access = false
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
