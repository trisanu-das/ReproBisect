[package]
name = "reprobisect"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.85"
description = "Causal debugger for non-reproducible builds"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.8"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
