[build]
image = "python:3.13-slim"
command = ["python3", "build.py"]
outputs = [
  "build/demo.jar",
  "build/demo-1.0-py3-none-any.whl",
  "build/demo.deb",
  "build/demo-oci.tar",
  "build/demo.exe",
  "build/demo.macho",
  "build/demo.wasm",
]

[experiments]
control_runs = 2

[experiments.dimensions]
network_access = false
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
