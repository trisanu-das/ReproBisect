[build]
image = "nicolaka/netshoot:v0.16"
command = ["python3", "build.py"]
outputs = ["build/out.txt", "build/child.txt"]

[experiments]
control_runs = 2
file_input_trace = true
network_trace = false
runtime_dependency_provenance = false
syscall_trace_max_bytes = 33554432

[experiments.dependency_cache_paths]
private = "/tmp/reprobisect-lineage-private-cache"

[experiments.dimensions]
network_access = false
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
