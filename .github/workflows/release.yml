name: Release qualification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/release-check.py --source-only --json-output release-source-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-source-qualification
          path: release-source-qualification.json
          if-no-files-found: error

  rust-matrix:
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  container-qualification:
    needs: rust-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [docker, podman]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.1
      - name: Install Podman
        if: matrix.runner == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - run: cargo build
      - name: Synthetic Docker fixtures
        if: matrix.runner == 'docker'
        run: ./scripts/test-fixtures.sh
      - name: Synthetic Podman fixtures
        if: matrix.runner == 'podman'
        run: ./scripts/test-podman.sh
      - name: Full real-world corpus
        run: >-
          python3 scripts/real-world-corpus.py run
          --tier all
          --runner "${{ matrix.runner }}"
          --binary target/debug/reprobisect
          --json-output "real-world-${{ matrix.runner }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-real-world-${{ matrix.runner }}
          path: real-world-${{ matrix.runner }}.json
          if-no-files-found: error

  package-linux:
    needs: [source-policy, rust-matrix, container-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.1
      - run: cargo build --release
      - name: Verify binary version
        run: test "$(target/release/reprobisect --version)" = "reprobisect 1.0.0-rc.1"
      - name: Build deterministic Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.0-rc.1"
          root="reprobisect-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${root}"
          install -m 0755 target/release/reprobisect "dist/${root}/reprobisect"
          install -m 0644 LICENSE README.md SECURITY.md "dist/${root}/"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C dist -cf "dist/${root}.tar" "${root}"
          gzip -n -9 "dist/${root}.tar"
          (cd dist && sha256sum "${root}.tar.gz" > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reprobisect-1.0.0-rc.1-linux-x86_64
          path: |
            dist/reprobisect-1.0.0-rc.1-x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
