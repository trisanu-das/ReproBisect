name: RC1 compiler repair

on:
  push:
    branches:
      - phase21-rc1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply compiler fixes if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/rc1-fix.patch ]]; then
            echo "repair patch absent; nothing to do"
            exit 0
          fi
          if ! git apply --check .github/rc1-fix.patch; then
            echo "repair patch is already applied or no longer applicable"
            exit 0
          fi
          git apply .github/rc1-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/compat.rs src/engine/mod.rs src/environment.rs src/engine/fix.rs
          git commit -m "Fix RC1 compiler blockers"
          git push origin HEAD:phase21-rc1
