[build]
image = "gcc:14"
command = ["sh", "-lc", "mkdir -p build && printf '%s\\n' \"$LC_ALL\" > build/result.txt"]
outputs = ["build/result.txt"]

[experiments]
control_runs = 2

[experiments.dimensions]
build_path = false
source_date_epoch = false
timezone = false
locale = true
hostname = false
cpu_count = false
