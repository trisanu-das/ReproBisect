name: RC1 integration repair

on:
  push:
    branches:
      - phase21-rc1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require Cargo.lock in source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/release-check.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    if toolchain.get("toolchain", {}).get("channel") != EXPECTED_TOOLCHAIN:\n        raise RuntimeError(f"rust-toolchain.toml must pin {EXPECTED_TOOLCHAIN}")\n    notes.append(f"package={EXPECTED_VERSION}; msrv={EXPECTED_RUST_VERSION}; default_toolchain={EXPECTED_TOOLCHAIN}")\n'''
          replacement = '''    if toolchain.get("toolchain", {}).get("channel") != EXPECTED_TOOLCHAIN:\n        raise RuntimeError(f"rust-toolchain.toml must pin {EXPECTED_TOOLCHAIN}")\n\n    lock_path = ROOT / "Cargo.lock"\n    if not lock_path.is_file():\n        raise RuntimeError("Cargo.lock must be committed for the stable release line")\n    lock = tomllib.loads(lock_path.read_text(encoding="utf-8"))\n    root_packages = [\n        package for package in lock.get("package", []) if package.get("name") == "reprobisect"\n    ]\n    if len(root_packages) != 1 or root_packages[0].get("version") != EXPECTED_VERSION:\n        raise RuntimeError(f"Cargo.lock must contain reprobisect {EXPECTED_VERSION}")\n    notes.append("Cargo.lock is committed and matches the package version")\n    notes.append(f"package={EXPECTED_VERSION}; msrv={EXPECTED_RUST_VERSION}; default_toolchain={EXPECTED_TOOLCHAIN}")\n'''
          if replacement in text:
              raise SystemExit(0)
          if text.count(anchor) != 1:
              raise SystemExit(f"release-check anchor count={text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          git diff --check
          git add scripts/release-check.py
          if git diff --cached --quiet; then
            echo "Cargo.lock source-policy check already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Require Cargo.lock in release source policy"
          git push origin HEAD:phase21-rc1
