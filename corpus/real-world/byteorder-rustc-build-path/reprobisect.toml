[build]
runner = "docker"
image = "rust@sha256:9a73a5088750b4c95158ab26629c854c3d6fc4b173cb7bc8079ad252d8ed7bfa"
command = ["sh", "-lc", "rustc --crate-name byteorder --crate-type lib -g --emit=obj src/lib.rs -o byteorder.o"]
outputs = ["byteorder.o"]
timeout_seconds = 180

[experiments]
control_runs = 2
intervention_runs = 1
confirmation_runs = 1

[experiments.dimensions]
build_path = true
source_path = false
source_date_epoch = false
source_mtime = false
timezone = false
locale = false
hostname = false
cpu_count = false
umask = false
directory_order = false
