[build]
image = "debian:bookworm"
command = ["sh", "-lc", "./package.sh"]
outputs = ["build/out.tar"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1

[experiments.dimensions]
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = true
cpu_count = false
umask = false
directory_order = false
