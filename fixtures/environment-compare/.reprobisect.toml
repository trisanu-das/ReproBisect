[build]
image = "python:3.13-slim"
command = ["python3", "build.py"]
outputs = ["out.txt"]
timeout_seconds = 120

[experiments]
control_runs = 2
comparison_runs = 2
comparison_subset_runs = 2
confirmation_runs = 1

[experiments.dimensions]
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
