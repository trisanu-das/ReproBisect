[build]
image = "debian:bookworm"
command = ["make"]
outputs = ["build/out.tar"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1

[experiments.dimensions]
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = true
directory_order = false
