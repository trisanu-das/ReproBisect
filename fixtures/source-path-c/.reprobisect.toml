[build]
image = "gcc:14"
command = ["sh", "-lc", "mkdir -p {build}/build && gcc -g -O0 -o {build}/build/app {source}/main.c"]
outputs = ["build/app"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1

[experiments.dimensions]
source_path = true
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
