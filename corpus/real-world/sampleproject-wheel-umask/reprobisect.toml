[build]
runner = "docker"
image = "reprobisect-corpus/python-wheel-0342:phase21"
command = ["sh", "-lc", "rm -rf build dist *.egg-info src/*.egg-info; python setup.py --quiet bdist_wheel"]
outputs = ["dist/sampleproject-2.0.0-py3-none-any.whl"]
timeout_seconds = 300

[build.env]
SOURCE_DATE_EPOCH = "1593523015"

[experiments]
control_runs = 2
intervention_runs = 1
confirmation_runs = 1

[experiments.dimensions]
build_path = false
source_path = false
source_date_epoch = false
source_mtime = false
timezone = false
locale = false
hostname = false
cpu_count = false
umask = true
directory_order = false
