[build]
image = "debian:bookworm"
command = ["sh", "-lc", "mkdir -p build; if [ \"$A\" = 1 ] && [ \"$B\" = 1 ]; then printf beta > build/out.txt; else printf alpha > build/out.txt; fi"]
outputs = ["build/out.txt"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1
interaction_search = true
interaction_runs = 2
max_interaction_variables = 4

[experiments.dimensions]
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false

[experiments.environment_variables]
A = ["0", "1"]
B = ["0", "1"]
