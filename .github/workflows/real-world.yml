name: Real-world corpus (extended)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: OCI runner used by ReproBisect
        required: true
        default: docker
        type: choice
        options:
          - docker
          - podman

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.1
      - run: cargo build --locked
      - name: Install Podman
        if: inputs.runner == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - run: python3 scripts/real-world-corpus.py validate
      - name: Run extended corpus
        run: >-
          python3 scripts/real-world-corpus.py run
          --tier extended
          --runner "${{ inputs.runner }}"
          --binary target/debug/reprobisect
          --json-output real-world-extended.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-world-extended-results-${{ inputs.runner }}
          path: real-world-extended.json
          if-no-files-found: ignore
