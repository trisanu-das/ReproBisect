[build]
image = "gcc:14"
command = ["sh", "-lc", "mkdir -p build && cp payload.txt build/out.txt"]
outputs = ["build/out.txt"]

[experiments]
control_runs = 2
intervention_runs = 1
confirmation_runs = 1

[experiments.dimensions]
network_access = false
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
