[build]
runner = "docker"
image = "gcc@sha256:3ae7320d7dd41f446a48930e1edf4e7a41c7be5ae43a5ddbf017c53fe6495738"
command = ["sh", "-lc", "make clean >/dev/null 2>&1 || true; make cJSON.o CFLAGS='-g -O2'"]
outputs = ["cJSON.o"]
timeout_seconds = 180

[experiments]
control_runs = 2
intervention_runs = 1
confirmation_runs = 1

[experiments.dimensions]
build_path = true
source_path = false
source_date_epoch = false
source_mtime = false
timezone = false
locale = false
hostname = false
cpu_count = false
umask = false
directory_order = false
