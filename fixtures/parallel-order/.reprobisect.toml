[build]
image = "python:3.13-slim"
command = ["python3", "build.py"]
outputs = ["build/out.txt"]

[experiments]
control_runs = 2
intervention_runs = 1
confirmation_runs = 1
stochastic_runs = 8
stochastic_alpha = 0.05

[experiments.dimensions]
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = true
umask = false
directory_order = false
