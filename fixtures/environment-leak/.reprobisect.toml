[build]
image = "gcc:14"
command = ["sh", "-lc", "mkdir -p build && printf '%s\\n' \"${BUILD_FLAVOR:-unset}\" > build/result.txt"]
outputs = ["build/result.txt"]

[experiments]
control_runs = 2

[experiments.dimensions]
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
cpu_count = false


[experiments.environment_variables]
BUILD_FLAVOR = ["alpha", "beta"]
