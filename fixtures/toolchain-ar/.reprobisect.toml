[build]
image = "gcc:14"
command = ["sh", "-lc", "make"]
outputs = ["build/libdemo.a"]

[experiments]
control_runs = 2
intervention_runs = 2
confirmation_runs = 1

[experiments.toolchain_variables]
AR = ["{source}/toolchains/ar-a", "{source}/toolchains/ar-b"]

[experiments.dimensions]
network_access = false
source_path = false
build_path = false
source_date_epoch = false
timezone = false
locale = false
hostname = false
source_mtime = false
cpu_count = false
umask = false
directory_order = false
